name: Deploy NextPress App

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync files to Server (rsync)
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: ${{ secrets.SERVER_TARGET }}
          ARGS: "-rlgoDIVz --delete --exclude='.git*' --exclude='node_modules' --exclude='wp/wp-content/uploads'"

      - name: Start Docker Compose on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.SERVER_TARGET }}

            # Re-verify that your .env file exists on the server
            if [ ! -f .env ]; then
              echo "Warning: .env file missing on server. Make sure it exists for environment variables!"
            fi

            docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build next-js wordpress ready-check
