services:
  db:
    image: mysql:8.0
    restart: always
    volumes:
      - db:/var/lib/mysql 
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:80"  
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  wordpress:
    image: wordpress:6.9.4
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./wp:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
    healthcheck:
      test: ["CMD-SHELL", "php -r 'echo (file_get_contents(\"wp-login.php\") !== false ? 0 : 1);'"]
      interval: 5s
      timeout: 5s
      retries: 5

  wp-cli:
    image: wordpress:cli
    tty: true
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    volumes:
      - ./wp:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
    user: "33:33" 
    command: >
      /bin/sh -c '
      if ! wp core is-installed --path="/var/www/html"; then
          wp core install --path="/var/www/html" --url="${WP_SITE_URL}" --title="${WP_SITE_TITLE}" --admin_user=${WP_ADMIN_USER} --admin_password=${WP_ADMIN_PASSWORD} --admin_email=${WP_ADMIN_EMAIL} --skip-email;
        fi;
      wp rewrite structure "/%postname%/" --path="/var/www/html" --hard;
      wp rewrite flush --path="/var/www/html" --hard;
      wp theme activate nextpress_theme
      '

  next-js:
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy
      wp-cli:
        condition: service_completed_successfully
    build:
      context: ./next-js
      dockerfile: Dockerfile
      target: ${NODE_ENV:-development}
    working_dir: /app
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    develop:
      watch:
        - action: sync
          path: ./next-js
          target: /app
          ignore:
            - ./next-js/node_modules/
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://0.0.0.0:3000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    image: nginx:alpine
    depends_on:
      db:
        condition: service_healthy
      adminer:
        condition: service_healthy
      wordpress:
        condition: service_healthy
      wp-cli:
        condition: service_completed_successfully
      next-js:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep nginx || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  ready-check:
    image: alpine
    depends_on:
      gateway:
        condition: service_healthy
    command: >
      sh -c '
        echo ""
        echo -e "\e[92m==============================================="
        echo -e "DEPLOYMENT SUCCESSFUL"
        echo -e "Open site: ${WP_SITE_URL}"
        echo -e "WP Admin: ${WP_SITE_URL}/wp-admin"
        echo -e "DB Admin: ${WP_SITE_URL}/db-admin"
        echo -e "===============================================\e[0m"
        if [ "${NODE_ENV}" = "development" ]; then
          echo -e "\e[92mDEVELOPMENT ENVIRONMENT ACTIVE"
          echo -e "Watching for changes in next-js"
          echo -e "===============================================\e[0m"
        fi
        echo ""
      '

volumes:
  db: